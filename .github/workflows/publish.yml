name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the released tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify exact release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor HEAD FETCH_HEAD
          python -m pip install "packaging>=24"
          python scripts/check_release_metadata.py --tag "$RELEASE_TAG"
          python scripts/check_evidence_assets.py
          python scripts/check_docs.py

      - name: Scan released history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install validation dependencies
        run: python -m pip install ".[dev,dynamic]"

      - name: Validate source
        run: |
          python -m ruff check .
          python -m pytest -q
          python -c "import frida; from debugger.engine import DebugEngine; assert DebugEngine().is_available"
          python -m bandit -q -r analysis debugger reporting storage ui main.py config.py --severity-level medium --confidence-level medium
          python -m pip_audit --strict --requirement requirements.txt
          python -m pip_audit --strict --requirement requirements-ai.txt
          python -m pip_audit --strict --requirement requirements-dynamic.txt
          python -c "import yara; yara.compile(filepath='examples/mock-output/aidebug-candidate.yar')"
          for script in debugger/scripts/*.js; do
            node --check "$script"
          done

      - name: Build distributions once
        run: python -m build

      - name: Validate distributions
        run: |
          python -m twine check --strict dist/*
          python scripts/check_distribution.py dist/*

      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/aidebug-wheel-smoke
          /tmp/aidebug-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/aidebug-wheel-smoke/bin/python -m pip check
          /tmp/aidebug-wheel-smoke/bin/aidebug --help >/dev/null
          /tmp/aidebug-wheel-smoke/bin/aidebug --version
          /tmp/aidebug-wheel-smoke/bin/python -c "from importlib.resources import files; assert files('analysis').joinpath('data/flirt_sigs.json').is_file()"
          /tmp/aidebug-wheel-smoke/bin/python -c "from analysis.static_analyzer import StaticAnalyzer; info = StaticAnalyzer().analyze('/bin/true'); assert info.file_format == 'ELF'"
          /tmp/aidebug-wheel-smoke/bin/aidebug --binary /bin/true --offline --no-tui --json-export --yara --max-functions 5 --out-dir /tmp/aidebug-wheel-output --db /tmp/aidebug-wheel-smoke.db
          test -s /tmp/aidebug-wheel-output/true_session_1_export.json
          test -s /tmp/aidebug-wheel-output/true_session_1.yar
          python -c "import yara; yara.compile(filepath='/tmp/aidebug-wheel-output/true_session_1.yar')"

      - name: Upload tested distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-${{ github.event.release.tag_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/1200km-aidebug/
    permissions:
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions-${{ github.event.release.tag_name }}
          path: dist/

      - name: Publish tested distributions
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
