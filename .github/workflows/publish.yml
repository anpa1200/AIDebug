name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable vX.Y.Z tag to verify and publish
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify exact release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor HEAD FETCH_HEAD
          python -m pip install "packaging>=24"
          python scripts/check_release_metadata.py --tag "$RELEASE_TAG"
          python scripts/check_evidence_assets.py
          python scripts/check_docs.py

      - name: Verify released commit passed secret scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_commit="$(git rev-parse HEAD)"
          for attempt in {1..18}; do
            successful_scans="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/commits/${release_commit}/check-runs" \
                --jq '[.check_runs[] | select(.name == "secret-scan" and .conclusion == "success")] | length'
            )"
            if test "$successful_scans" -ge 1; then
              echo "The exact release commit passed the required secret-scan check."
              exit 0
            fi
            if test "$attempt" -lt 18; then
              echo "Waiting for the tagged commit's secret-scan check (${attempt}/18)..."
              sleep 10
            fi
          done
          echo "The exact release commit has no successful secret-scan check." >&2
          exit 1

      - name: Install validation dependencies
        run: python -m pip install ".[dev,dynamic]"

      - name: Validate source
        run: |
          python -m ruff check .
          python -m pytest -q
          python -c "import frida; from debugger.engine import DebugEngine; assert DebugEngine().is_available"
          python -m bandit -q -r analysis debugger reporting storage ui main.py config.py --severity-level medium --confidence-level medium
          python -m pip_audit --strict --requirement requirements.txt
          python -m pip_audit --strict --requirement requirements-ai.txt
          python -m pip_audit --strict --requirement requirements-dynamic.txt
          python -c "import yara; yara.compile(filepath='examples/mock-output/aidebug-candidate.yar')"
          for script in debugger/scripts/*.js; do
            node --check "$script"
          done

      - name: Build distributions once
        run: python -m build

      - name: Validate distributions
        run: |
          python -m twine check --strict dist/*
          python scripts/check_distribution.py dist/*

      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/aidebug-wheel-smoke
          /tmp/aidebug-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/aidebug-wheel-smoke/bin/python -m pip check
          /tmp/aidebug-wheel-smoke/bin/aidebug --help >/dev/null
          /tmp/aidebug-wheel-smoke/bin/aidebug --version
          /tmp/aidebug-wheel-smoke/bin/python -c "from importlib.resources import files; assert files('analysis').joinpath('data/flirt_sigs.json').is_file()"
          /tmp/aidebug-wheel-smoke/bin/python -c "from importlib.resources import files; assert files('analysis').joinpath('data/string_descriptions.json').is_file()"
          /tmp/aidebug-wheel-smoke/bin/python -c "from analysis.string_analyzer import StringAnalyzer; record = StringAnalyzer(min_length=4, encodings=('ascii',)).analyze(b'kernel32.dll\\0').records[0]; assert record.entities == (('dll', 'kernel32.dll'),) and record.description"
          /tmp/aidebug-wheel-smoke/bin/python -c "from analysis.static_analyzer import StaticAnalyzer; info = StaticAnalyzer().analyze('/bin/true'); assert info.file_format == 'ELF'"
          /tmp/aidebug-wheel-smoke/bin/aidebug --binary /bin/true --offline --no-tui --json-export --yara --max-functions 5 --out-dir /tmp/aidebug-wheel-output --db /tmp/aidebug-wheel-smoke.db
          test -s /tmp/aidebug-wheel-output/true_session_1_export.json
          test -s /tmp/aidebug-wheel-output/true_session_1.yar
          python -c "import yara; yara.compile(filepath='/tmp/aidebug-wheel-output/true_session_1.yar')"

      - name: Upload tested distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-${{ github.event.release.tag_name || inputs.release_tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/1200km-aidebug/
    permissions:
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions-${{ github.event.release.tag_name || inputs.release_tag }}
          path: dist/

      - name: Publish tested distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
