[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "1200km-aidebug"
version = "1.1.0"
description = "Malware triage with offline heuristics, optional AI, ATT&CK candidates, YARA seeds, and reports."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Andrey Pautov", email = "1200km@gmail.com" }]
keywords = [
  "malware-analysis",
  "reverse-engineering",
  "debugger",
  "frida",
  "capstone",
  "yara",
  "mitre-attack",
  "cti",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "capstone>=5",
  "pefile>=2023.2.7",
  "pyelftools>=0.31",
  "rich>=15.0.0",
  "textual>=0.52.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40", "yara-python>=4.5.4"]
dynamic = ["frida>=17,<18"]
all = ["anthropic>=0.40", "frida>=17,<18", "yara-python>=4.5.4"]
dev = [
  "anthropic>=0.40",
  "bandit>=1.9.4",
  "build>=1.5.0",
  "packaging>=24",
  "pip-audit>=2.10.1",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "tomli>=2; python_version < '3.11'",
  "twine>=5",
  "yara-python>=4.5.4",
]

[project.scripts]
aidebug = "main:main"

[project.urls]
Homepage = "https://github.com/anpa1200/AIDebug"
Repository = "https://github.com/anpa1200/AIDebug"
Documentation = "https://github.com/anpa1200/AIDebug#readme"
Issues = "https://github.com/anpa1200/AIDebug/issues"
Changelog = "https://github.com/anpa1200/AIDebug/blob/main/CHANGELOG.md"
Security = "https://github.com/anpa1200/AIDebug/blob/main/SECURITY.md"

[tool.setuptools]
py-modules = ["main", "config"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["analysis*", "debugger*", "reporting*", "storage*", "ui*"]

[tool.setuptools.package-data]
analysis = ["data/*.json"]
debugger = ["scripts/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
